name: Sync Reading Highlights

on:
  schedule:
    - cron: '0 5 * * *'  # Every day at 5:00 UTC (7:00 Amsterdam time)
  workflow_dispatch:       # Allow manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch highlights from Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python fetch_highlights.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/highlights.json
          git diff --cached --quiet || git commit -m "chore: sync reading highlights $(date -u +%Y-%m-%d)"
          git push
